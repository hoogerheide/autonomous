<head>
    <script src="lib/jquery-3.7.1.min.js"></script>
    <script src="lib/plotly-2.27.0.min.js" charset="utf-8"></script>
    <script src="lib/socket.io.min.js"></script>
    <script type="module">

        const sio_base_path = window.location.pathname
        console.log(sio_base_path)

        const socket = io("", {path: `${sio_base_path}socket.io`});
        var current_step_progress;
        var plotdata;

        function clear() {
            $("#fit_progress").empty();
            $("#queue_text").empty();
            reset_plotdata()
            Plotly.purge('plot')
            new_step('init', 'Initialization')
        }

        function new_step(stepnum, text) {
            //let current_step = $("<div id=step_" + stepnum + " class='fit-step'></div>").text(text);
            current_step_progress = $("<div id=step_" + stepnum + "_progress class='fit-step-progress grid-fit-progress-text'></div>");
            //current_step.append(current_step_progress);
            $("#fit_progress").prepend(current_step_progress).prepend(text + "<br>");
        }

        socket.on("connect", function () {
	    console.log(this.io.uri)
            $("#connect_monitor").text("Connected to " + window.location.host + sio_base_path)
                         .addClass("titletext-connected")
                         .removeClass("titletext-disconnected")
            //socket.emit('get_history', null)
        })

        socket.on("disconnect", function () {
            $("#connect_monitor").text('Disconnected')
                         .removeClass("titletext-connected")
                         .addClass("titletext-disconnected")
            $("#btnStart").removeClass("btn-disabled")
            $("#btnStart").prop('disabled', false)
            //console.log('Disconnected')
        })

        socket.on("queue_update", data => {
            $("#queue_text .measurement-pending").addClass("measurement-skipped").removeClass("measurement-pending");
            // Process queue data into table
            const headerinfo = {'model': 'Model', 'x': 'x', 'intent': 'Intent', 'time': 'Time'}
            var header = $('<tr>')
            Object.values(headerinfo).forEach(v => {
                header.append($('<th>').text(v))
            })
            var newtable = $('<table class="queue-table">').append(header)
            Object.values(data).forEach(q => {
                var newrow = $('<tr id=point_' + q['step_id'] + '_' + q['point_id'] + '_' + q['point_index'] + ' class="measurement-pending">')
                Object.keys(headerinfo).forEach(k => {
                    newrow.append($('<td>').text(q[k]))
                })
                newtable.append(newrow)
            })
            $("#queue_text").prepend(newtable)
        })

        socket.on("set_current_measurement", data => {
            $("#queue_text .measurement-current").addClass("measurement-done").removeClass("measurement-current");
            $('#' + data).addClass("measurement-current").removeClass("measurement-pending measurement-skipped")
        })

        socket.on("clear", data => {
            //console.log(data)
            clear()
        })

        socket.on("new_step", data => {
            $("#fit_progress .fit-step-progress").addClass("fit-inactive").removeClass("fit-step-progress")
            //$("#fit_progress").prepend("<hr>")
            new_step(data['step'], data['text'])
        })

        socket.on("fit_update", data => {
            //console.log(data)
            current_step_progress.prepend(data + "<br>")
        })

        // When buttons clicked, send message; do things as needed with response
        $("#btnStart").on('click', function () {
            socket.emit('start', null);
        })

        socket.on("start_received", data => {
            $("#btnStart").prop('disabled', true)
            $("#btnStart").addClass("btn-disabled")
        })

        $("#btnTerminateCount").on('click', function () {
            socket.emit('terminate_count', null);
        })

        $("#btnTerminateFit").on('click', function () {
            socket.emit('terminate_fit', null);
        })

        $("#btnStop").on('click', function () {
            socket.emit('stop', null);
        })

        var CB_color_cycle = ['#377eb8', '#ff7f00', '#4daf4a',
                  '#f781bf', '#a65628', '#984ea3',
                  '#999999', '#e41a1c', '#dede00']
        
        function makePlot(data) {
            var traces = [];
            Object.values(data['data']).forEach((ptdata, idx) => {
                traces.push({
                    x: ptdata['x'],
                    y: ptdata['v'],
                    error_y: {
                        type: 'data',
                        array: ptdata['dv'],
                        visible: true
                    },
                    line: {
                        color: CB_color_cycle[idx]
                    },
                    showlegend: false,
                    name: 'model ' + idx,
                    mode: 'markers',
                    type: 'scatter'
                })
            })
            Object.values(data['ci']).forEach((ptdata, idx) => {
                traces.push({
                    x: ptdata['x'],
                    y: ptdata['68']['lower'],
                    line: {
                        width: 0,
                    },
                    showlegend: false,
                    hoverinfo: 'none',
                    type: 'scatter',
                    mode: 'lines'
                });
                traces.push({
                    x: ptdata['x'],
                    y: ptdata['68']['upper'],
                    fill: 'tonexty',
                    fillcolor: CB_color_cycle[idx] + '44',
                    line: {
                        width: 0,
                    },
                    showlegend: false,
                    hoverinfo: 'none',
                    type: 'scatter',
                    mode: 'lines'
                });
                traces.push({
                    x: ptdata['x'],
                    y: ptdata['95']['lower'],
                    showlegend: false,
                    line: {
                        width: 0,
                    },
                    hoverinfo: 'none',
                    type: 'scatter',
                    mode: 'lines'
                });
                traces.push({
                    x: ptdata['x'],
                    y: ptdata['95']['upper'],
                    fill: 'tonexty',
                    fillcolor: CB_color_cycle[idx] + '44',
                    showlegend: false,
                    line: {
                        width: 0,
                    },
                    hoverinfo: 'none',
                    type: 'scatter',
                    mode: 'lines'
                });
            })
            return traces
        }

        function reset_plotdata() {
            plotdata = {'data': [], 'ci': []};
        };

        function renderPlot() {
            var traces = makePlot(plotdata)
            var layout = {
                yaxis: {type: 'log',
                        showexponent: 'all',
                        exponentformat: 'power',
                        autorange: true,
                        title: {text: 'reflectivity'}},
                xaxis: {title: {text: 'Q (Å⁻¹)'}},
                margin: {l: 50, b: 50, t: 25, r: 25, autoexpand: true},
                plot_bgcolor:"#FFFFFF44",
                paper_bgcolor:"#FFFFFF00",
                datarevision: true
            }
            Plotly.newPlot('plot', traces, layout)
        }

        socket.on("autorefl_data", data => {
            plotdata = {...plotdata, ...JSON.parse(data)}
            renderPlot()
        })

        socket.on("autorefl_profiles", data => {
            plotdata = {...plotdata, ...JSON.parse(data)}
            renderPlot()
        })

        socket.on("autorefl_convergence", data => {
            const conv = JSON.parse(data)
            if (!conv.length) return
            const steps = conv.map(c => c.step)
            Plotly.react('plot_convergence', [
                {x: steps, y: conv.map(c => c.dH), name: 'ΔH',
                 mode: 'lines+markers', type: 'scatter'},
                {x: steps, y: conv.map(c => c.chisq), name: 'χ²',
                 mode: 'lines+markers', type: 'scatter', yaxis: 'y2'},
            ], {
                xaxis: {title: {text: 'step'}},
                yaxis: {title: {text: 'ΔH (nats)'}, side: 'left'},
                yaxis2: {title: {text: 'χ²'}, side: 'right', overlaying: 'y'},
                legend: {orientation: 'h', y: 1.15},
                margin: {l: 50, b: 40, t: 10, r: 50},
                plot_bgcolor:"#FFFFFF44", paper_bgcolor:"#FFFFFF00",
            })
        })

        socket.on("autorefl_fom", data => {
            const foms = JSON.parse(data)
            Plotly.react('plot_fom', foms.map((f, idx) => ({
                x: f.x, y: f.fom,
                name: 'model ' + f.model,
                line: {color: CB_color_cycle[idx % CB_color_cycle.length]},
                mode: 'lines', type: 'scatter'
            })), {
                xaxis: {title: {text: 'x'}},
                yaxis: {title: {text: 'FOM'}},
                legend: {orientation: 'h', y: 1.15},
                margin: {l: 50, b: 40, t: 10, r: 25},
                plot_bgcolor:"#FFFFFF44", paper_bgcolor:"#FFFFFF00",
            })
        })

        $(document).ready(function () {
            clear()
        })

        window.onresize = function() {
            Plotly.Plots.resize('plot');
            Plotly.Plots.resize('plot_convergence');
            Plotly.Plots.resize('plot_fom');
        };

    </script>
    <style>
        div {
            font-family: sans-serif;
            box-sizing: border-box;
	    /*display: flex;
	    flex-direction: column;*/
            /*white-space: pre-wrap;*/
        }
        .queue-table {
            border-collapse: collapse;
            border: 2px solid black;
            background-color: white;
            width: 100%;
            padding: 8px;
            margin: 8px;
        }
        tr {
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
        }
        th {
            background-color: rgb(67, 140, 104);
            color:white;
            border: 1px solid black;
        }
        .bigtitletext{
            font-size: xx-large;
        }
        .titletext {
            color: #444444;
            font-size: large;
            font-weight: bolder;
            text-align: center;
        }
        .monitortext {
            font-size: large;
            font-weight: bolder;
            text-align: right;
        }
        .titletext-connected {
            color: green
        }
        .titletext-disconnected {
            color: red
        }
        .fit-step {
            border-radius: 10px;
            border: 2px solid steelblue;
            background-color: rgb(229, 242, 252);
            margin: 5px;
            padding: 10px;
            /*color: blue*/
        }        
        .fit-step-progress {
            background-color: lightsteelblue;
            border-radius: 10px;
            border: 2px solid steelblue;
            margin: 5px;
            padding: 10px;
            /*color: purple*/
        }        
        .fit-inactive {
            background-color: lightgrey;
            border-radius: 10px;
            border: 2px solid grey;
            margin: 10px;
            padding: 10px;
        }
        .measurement-current {
            font-weight: bold;
            color: green;
            border: 2px solid green;
        }
        .measurement-skipped {
            text-decoration: line-through;
            text-decoration-color: rgb(128, 128, 128);
            color: rgb(128, 128, 128);
        }
        .measurement-pending {
            color: black
        }
        .measurement-done {
            color: chocolate
        }
        .grid-container {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: [col0] minmax(0, 1fr) [col1] minmax(0, 2fr);
            grid-template-rows: [row0] minmax(0, 1fr) [row1] minmax(0, 3fr) [row2] minmax(0, 6fr) [row3] minmax(0, 4fr);
            grid-gap: 20px;
            height: 95%;
        }
        .grid-title {
            grid-column: col0;
            grid-row: row0;
        }
        .grid-title-right {
            grid-column: col1;
            grid-row: row0;
        }
        .grid-fit {
            grid-column: col0;
            grid-row: row1 / span 3;
            height: 100%;
        }
        .grid-progress {
            overflow-y: auto;
            overflow-x: hidden;
            height:100%;
        }
        .grid-progress-queue {
            border: 2px solid green;
            border-radius: 10px;
            background-color: rgb(209, 250, 230);
            padding: 10px
        }
        .grid-fit-progress-text {
            overflow-y: auto;
            max-height: 30%;
        }
        .grid-queue {
            grid-column: col1;
            grid-row: row1;
        }
        .grid-plot {
            grid-column: col1;
            grid-row: row2;
        }
        .grid-extra {
            grid-column: col1;
            grid-row: row3;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-extra-panel {
            display: flex;
            flex-direction: column;
        }
        .plot-frame {
            border-radius: 10px;
            border: 2px solid rgb(107, 70, 180);
            background-color: rgb(220, 206, 248);
            margin: 0px;
            padding: 10px;
            height: 100%;
            width: 100%
        }
        .plot {
            overflow: hidden;
            height:100%;
            width:100%
        }
        .btn-container {
            display: table;
            width: 100%
        }
        .btn {
            display: table-cell;
            margin-left: 10px;
            padding: 5px;
            border-radius: 5px;
            min-width: 20%;
            font-stretch: narrower;
        }
        .btn-disabled {
            background-color: gray !important;
        }
        #btnStart {
            color: white;
            background-color: rgb(71, 130, 71);
        }
        #btnStop {
            color: white;
            background-color: rgb(180, 92, 92);
        }
        #btnTerminateCount {
            background-color: rgb(206, 200, 143);
        }
        #btnTerminateFit {
            background-color: rgb(206, 200, 143);
        }

    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-title bigtitletext">
            <em>AutoRefl</em> Monitor
        </div>
        <div class="grid-title-right">
            <div id="connect_monitor" class="monitortext titletext-disconnected">
                Disconnected
            </div>
            <div id="queue_buttons" class="titletext btn-container">
                <button id="btnStart" class="btn">Start</button>
                <button id="btnTerminateCount" class="btn">Terminate Count</button>
                <button id="btnTerminateFit" class="btn">Terminate Fit</button>
                <button id="btnStop" class="btn">Stop</button>
            </div>
        </div>
        <div id="fit_progress_container" class="grid-fit">
            <div id="fit_progress_title" class="titletext">Fit Progress</div>
            <div class="grid-progress">
                <div id="fit_progress" class="fit-step"></div>
            </div>
        </div>
        <div id="plot_container" class="grid-plot">
            <div class="titletext">R(Q) — Data &amp; Credible Intervals</div>
            <div class="grid-progress plot-frame">
                <div id="plot" class="plot"></div>
            </div>
        </div>

        <div class="grid-extra">
            <div class="grid-extra-panel">
                <div class="titletext">Convergence</div>
                <div class="plot-frame">
                    <div id="plot_convergence" class="plot"></div>
                </div>
            </div>
            <div class="grid-extra-panel">
                <div class="titletext">FOM Landscape</div>
                <div class="plot-frame">
                    <div id="plot_fom" class="plot"></div>
                </div>
            </div>
        </div>
        <div id="queue" class="grid-queue green">
            <div id="queue_title" class="titletext">Measurement Queue</div>
            <div id="queue_text_scroll" class="grid-progress">
                <div id="queue_text" class="grid-progress-queue"></div>
            </div>
        </div>
      
    </div>
</body>
